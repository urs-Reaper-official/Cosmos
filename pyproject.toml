[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cosmos-agent"
version = "0.1.0"
description = "A configurable conversational agent with local memory and learning-data curation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
web = ["fastapi>=0.115", "uvicorn>=0.30"]
local = ["llama-cpp-python>=0.3.8"]
test = ["httpx>=0.27"]

[project.scripts]
cosmos = "cosmos.cli:main"
cosmos-web = "cosmos.webapp:main"
cosmos-learning = "cosmos.learning.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cosmos = ["static/*", "migrations/*.sql"]